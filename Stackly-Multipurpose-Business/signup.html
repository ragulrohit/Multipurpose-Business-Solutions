<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Stackly - Multipurpose Business Solutions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-left">
            <div class="brand">
                <div class="logo-icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <h2>Join Stackly</h2>
                <p class="tagline">Create your account and start transforming your business today.</p>
            </div>
            <div class="auth-image">
                <div class="img-ph"></div>
            </div>
            <div class="decor-shape s1"></div>
            <div class="decor-shape s2"></div>
            <div class="decor-shape s3"></div>
        </section>

        <section class="auth-right">
            <div class="auth-form">
                <h2>Create Account</h2>
                <p class="subtitle">Fill in your details to get started</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-wrap">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                            <button type="button" class="password-toggle" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmpassword">Confirm Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm your password" required>
                            <button type="button" class="password-toggle" data-target="confirmpassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#">Terms &amp; Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg full">Create Account</button>

                    <p class="auth-link">Already have an account? <a href="login.html">Sign In</a></p>
                </form>

                <div class="success-msg"></div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
