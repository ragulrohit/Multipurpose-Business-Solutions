<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your Stackly dashboard to manage your business solutions.">
    <meta name="author" content="Stackly">
    <title>Login | Stackly</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- ==================== AUTH CONTAINER ==================== -->
    <section class="auth-container">

        <!-- ===== LEFT: BRANDING HERO ===== -->
        <div class="auth-left">
            <div class="decor-shape s1"></div>
            <div class="decor-shape s2"></div>
            <div class="decor-shape s3"></div>

            <div class="brand">
                <div class="logo-icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to access your business dashboard and manage your solutions.</p>
            </div>

            <div class="auth-image">
                <div class="img-ph">
                    <i class="fas fa-chart-line"></i>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT: LOGIN FORM ===== -->
        <div class="auth-right">
            <div class="auth-form">
                <h2>Sign In</h2>
                <p class="subtitle">Enter your credentials to access your account</p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
                        <span class="error-msg">Please enter a valid email address</span>
                    </div>

                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                        <span class="error-msg">Password must be at least 6 characters</span>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="remember">
                        <label for="rememberMe">Remember Me</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg full-width">
                        Login <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>

                <div class="success-msg" id="successMsg">
                    <i class="fas fa-check-circle"></i> Login successful! Redirecting...
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
