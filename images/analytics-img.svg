<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Dashboard frame -->
  <rect x="40" y="30" width="320" height="240" rx="10" fill="#e8eaf6" opacity="0.1" stroke="#e8eaf6" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Chart area -->
  <rect x="60" y="60" width="180" height="120" rx="5" fill="#e8eaf6" opacity="0.08"/>
  <!-- Line chart -->
  <polyline points="70,160 110,130 150,145 190,100 230,110" stroke="#e8eaf6" stroke-width="2.5" fill="none" opacity="0.5"/>
  <circle cx="70" cy="160" r="4" fill="#e8eaf6" opacity="0.5"/>
  <circle cx="110" cy="130" r="4" fill="#e8eaf6" opacity="0.5"/>
  <circle cx="150" cy="145" r="4" fill="#e8eaf6" opacity="0.5"/>
  <circle cx="190" cy="100" r="4" fill="#e8eaf6" opacity="0.5"/>
  <circle cx="230" cy="110" r="4" fill="#e8eaf6" opacity="0.5"/>
  <!-- Pie chart -->
  <circle cx="310" cy="110" r="45" fill="#e8eaf6" opacity="0.1"/>
  <path d="M310,110 L310,65 A45,45 0 0,1 350,130 Z" fill="#e8eaf6" opacity="0.25"/>
  <path d="M310,110 L350,130 A45,45 0 0,1 280,150 Z" fill="#e8eaf6" opacity="0.18"/>
  <!-- Stats boxes -->
  <rect x="60" y="200" width="90" height="55" rx="5" fill="#e8eaf6" opacity="0.1"/>
  <rect x="165" y="200" width="90" height="55" rx="5" fill="#e8eaf6" opacity="0.1"/>
  <rect x="270" y="200" width="90" height="55" rx="5" fill="#e8eaf6" opacity="0.1"/>
  <!-- Mini bars in stat boxes -->
  <rect x="72" y="235" width="15" height="12" rx="2" fill="#e8eaf6" opacity="0.3"/>
  <rect x="92" y="228" width="15" height="19" rx="2" fill="#e8eaf6" opacity="0.25"/>
  <rect x="112" y="222" width="15" height="25" rx="2" fill="#e8eaf6" opacity="0.3"/>
  <!-- Grid lines -->
  <line x1="70" y1="120" x2="230" y2="120" stroke="#e8eaf6" stroke-width="0.5" opacity="0.15"/>
  <line x1="70" y1="140" x2="230" y2="140" stroke="#e8eaf6" stroke-width="0.5" opacity="0.15"/>
</svg>