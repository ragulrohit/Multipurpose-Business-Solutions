<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Server rack -->
  <rect x="140" y="40" width="120" height="200" rx="5" fill="#e8eaf6" opacity="0.12" stroke="#e8eaf6" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Server units -->
  <rect x="150" y="55" width="100" height="25" rx="3" fill="#e8eaf6" opacity="0.18"/>
  <rect x="150" y="90" width="100" height="25" rx="3" fill="#e8eaf6" opacity="0.15"/>
  <rect x="150" y="125" width="100" height="25" rx="3" fill="#e8eaf6" opacity="0.18"/>
  <rect x="150" y="160" width="100" height="25" rx="3" fill="#e8eaf6" opacity="0.15"/>
  <rect x="150" y="195" width="100" height="25" rx="3" fill="#e8eaf6" opacity="0.18"/>
  <!-- LED indicators on servers -->
  <circle cx="165" cy="67" r="3" fill="#4caf50" opacity="0.5"/>
  <circle cx="175" cy="67" r="3" fill="#4caf50" opacity="0.4"/>
  <circle cx="165" cy="102" r="3" fill="#4caf50" opacity="0.5"/>
  <circle cx="175" cy="102" r="3" fill="#f44336" opacity="0.4"/>
  <circle cx="165" cy="137" r="3" fill="#4caf50" opacity="0.5"/>
  <circle cx="175" cy="137" r="3" fill="#4caf50" opacity="0.4"/>
  <circle cx="165" cy="172" r="3" fill="#ff9800" opacity="0.4"/>
  <circle cx="175" cy="172" r="3" fill="#4caf50" opacity="0.5"/>
  <circle cx="165" cy="207" r="3" fill="#4caf50" opacity="0.5"/>
  <!-- Connection lines -->
  <line x1="140" y1="67" x2="60" y2="67" stroke="#e8eaf6" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="140" y1="137" x2="60" y2="137" stroke="#e8eaf6" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="260" y1="67" x2="340" y2="67" stroke="#e8eaf6" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="260" y1="137" x2="340" y2="137" stroke="#e8eaf6" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,4"/>
  <!-- Side nodes -->
  <rect x="30" y="55" width="30" height="25" rx="4" fill="#e8eaf6" opacity="0.1"/>
  <rect x="30" y="125" width="30" height="25" rx="4" fill="#e8eaf6" opacity="0.1"/>
  <rect x="340" y="55" width="30" height="25" rx="4" fill="#e8eaf6" opacity="0.1"/>
  <rect x="340" y="125" width="30" height="25" rx="4" fill="#e8eaf6" opacity="0.1"/>
  <!-- Floor -->
  <rect x="0" y="245" width="400" height="55" fill="#e8eaf6" opacity="0.04"/>
</svg>