<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Meeting table -->
  <ellipse cx="200" cy="200" rx="140" ry="40" fill="#fff3e0" opacity="0.2"/>
  <rect x="100" y="190" width="200" height="10" rx="5" fill="#fff3e0" opacity="0.3"/>
  <!-- Person 1 (left) -->
  <circle cx="110" cy="140" r="18" fill="#fff3e0" opacity="0.85"/>
  <rect x="97" y="158" width="26" height="35" rx="4" fill="#fff3e0" opacity="0.8"/>
  <!-- Person 2 (center left) -->
  <circle cx="170" cy="130" r="20" fill="#fff3e0" opacity="0.85"/>
  <rect x="155" y="150" width="30" height="38" rx="4" fill="#fff3e0" opacity="0.8"/>
  <!-- Person 3 (center) -->
  <circle cx="230" cy="130" r="20" fill="#ffe0b2" opacity="0.85"/>
  <rect x="215" y="150" width="30" height="38" rx="4" fill="#ffe0b2" opacity="0.8"/>
  <!-- Person 4 (right) -->
  <circle cx="290" cy="140" r="18" fill="#fff3e0" opacity="0.85"/>
  <rect x="277" y="158" width="26" height="35" rx="4" fill="#fff3e0" opacity="0.8"/>
  <!-- Presentation screen -->
  <rect x="155" y="30" width="90" height="60" rx="5" fill="#fff3e0" opacity="0.15" stroke="#fff3e0" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="195" y="90" width="10" height="20" fill="#fff3e0" opacity="0.15"/>
  <!-- Documents on table -->
  <rect x="170" y="185" width="20" height="3" rx="1" fill="#ffe0b2" opacity="0.4"/>
  <rect x="210" y="185" width="25" height="3" rx="1" fill="#ffe0b2" opacity="0.4"/>
</svg>