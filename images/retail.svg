<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2185b"/>
      <stop offset="100%" style="stop-color:#e53935"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Shopping cart -->
  <path d="M130,100 L150,100 L175,170 L280,170" stroke="#fce4ec" stroke-width="3" fill="none" opacity="0.35"/>
  <circle cx="190" cy="190" r="12" fill="none" stroke="#fce4ec" stroke-width="2" opacity="0.3"/>
  <circle cx="260" cy="190" r="12" fill="none" stroke="#fce4ec" stroke-width="2" opacity="0.3"/>
  <!-- Items in cart -->
  <rect x="180" y="135" width="20" height="30" rx="3" fill="#fce4ec" opacity="0.3"/>
  <rect x="210" y="125" width="25" height="40" rx="3" fill="#fce4ec" opacity="0.25"/>
  <rect x="245" y="140" width="22" height="25" rx="3" fill="#fce4ec" opacity="0.3"/>
  <!-- Store/shelf -->
  <rect x="60" y="100" width="60" height="100" rx="5" fill="#fce4ec" opacity="0.1" stroke="#fce4ec" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="68" y="110" width="44" height="10" rx="2" fill="#fce4ec" opacity="0.15"/>
  <rect x="68" y="130" width="44" height="10" rx="2" fill="#fce4ec" opacity="0.12"/>
  <rect x="68" y="150" width="44" height="10" rx="2" fill="#fce4ec" opacity="0.15"/>
  <!-- Price tags -->
  <rect x="300" y="80" width="40" height="25" rx="5" fill="#fce4ec" opacity="0.2"/>
  <line x1="320" y1="75" x2="320" y2="80" stroke="#fce4ec" stroke-width="1.5" opacity="0.25"/>
  <!-- Customer -->
  <circle cx="320" cy="220" r="16" fill="#fce4ec" opacity="0.35"/>
  <rect x="308" y="236" width="24" height="30" rx="4" fill="#fce4ec" opacity="0.3"/>
  <!-- Bag -->
  <rect x="340" y="245" width="20" height="25" rx="3" fill="#fce4ec" opacity="0.25"/>
  <path d="M345,245 Q350,235 355,245" stroke="#fce4ec" stroke-width="1.5" fill="none" opacity="0.25"/>
</svg>