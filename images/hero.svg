<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#311b92;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- City skyline -->
  <rect x="20" y="160" width="30" height="140" fill="#e8eaf6" opacity="0.15"/>
  <rect x="55" y="130" width="25" height="170" fill="#e8eaf6" opacity="0.12"/>
  <rect x="85" y="145" width="35" height="155" fill="#e8eaf6" opacity="0.18"/>
  <rect x="125" y="110" width="28" height="190" fill="#e8eaf6" opacity="0.14"/>
  <rect x="160" y="140" width="32" height="160" fill="#e8eaf6" opacity="0.16"/>
  <rect x="200" y="120" width="26" height="180" fill="#e8eaf6" opacity="0.13"/>
  <rect x="235" y="150" width="30" height="150" fill="#e8eaf6" opacity="0.17"/>
  <rect x="270" y="135" width="28" height="165" fill="#e8eaf6" opacity="0.15"/>
  <rect x="305" y="155" width="35" height="145" fill="#e8eaf6" opacity="0.12"/>
  <rect x="345" y="125" width="30" height="175" fill="#e8eaf6" opacity="0.16"/>
  <!-- Person silhouette -->
  <circle cx="200" cy="80" r="25" fill="#e8eaf6" opacity="0.9"/>
  <rect x="180" y="105" width="40" height="50" rx="5" fill="#e8eaf6" opacity="0.9"/>
  <polygon points="160,155 175,200 155,200" fill="#e8eaf6" opacity="0.8"/>
  <polygon points="225,155 240,200 220,200" fill="#e8eaf6" opacity="0.8"/>
  <!-- Ground line -->
  <rect x="0" y="295" width="400" height="5" fill="#e8eaf6" opacity="0.2"/>
</svg>