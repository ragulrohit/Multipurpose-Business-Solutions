<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Person with plus sign -->
  <circle cx="200" cy="100" r="35" fill="#e8f5e9" opacity="0.25"/>
  <rect x="175" y="135" width="50" height="45" rx="6" fill="#e8f5e9" opacity="0.2"/>
  <!-- Plus icon (signup) -->
  <line x1="270" y1="80" x2="270" y2="110" stroke="#e8f5e9" stroke-width="3" opacity="0.35"/>
  <line x1="255" y1="95" x2="285" y2="95" stroke="#e8f5e9" stroke-width="3" opacity="0.35"/>
  <circle cx="270" cy="95" r="22" fill="none" stroke="#e8f5e9" stroke-width="2" opacity="0.25"/>
  <!-- Form fields -->
  <rect x="100" y="200" width="200" height="20" rx="10" fill="#e8f5e9" opacity="0.1" stroke="#e8f5e9" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="100" y="230" width="200" height="20" rx="10" fill="#e8f5e9" opacity="0.1" stroke="#e8f5e9" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Person icon in field -->
  <circle cx="115" cy="210" r="5" fill="#e8f5e9" opacity="0.2"/>
  <circle cx="115" cy="240" r="5" fill="#e8f5e9" opacity="0.2"/>
  <!-- Submit button -->
  <rect x="120" y="260" width="160" height="28" rx="14" fill="#e8f5e9" opacity="0.18"/>
  <!-- Decorative rings -->
  <circle cx="200" cy="100" r="50" fill="none" stroke="#e8f5e9" stroke-width="0.8" opacity="0.1"/>
  <circle cx="200" cy="100" r="65" fill="none" stroke="#e8f5e9" stroke-width="0.6" opacity="0.07"/>
</svg>