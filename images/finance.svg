<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#004d40"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Dollar sign -->
  <text x="200" y="120" text-anchor="middle" fill="#c8e6c9" font-size="80" font-family="Arial" font-weight="bold" opacity="0.3">$</text>
  <!-- Chart -->
  <rect x="60" y="160" width="280" height="110" rx="5" fill="#c8e6c9" opacity="0.08"/>
  <!-- Bar chart -->
  <rect x="80" y="220" width="25" height="40" rx="2" fill="#c8e6c9" opacity="0.2"/>
  <rect x="115" y="200" width="25" height="60" rx="2" fill="#c8e6c9" opacity="0.25"/>
  <rect x="150" y="185" width="25" height="75" rx="2" fill="#c8e6c9" opacity="0.3"/>
  <rect x="185" y="175" width="25" height="85" rx="2" fill="#c8e6c9" opacity="0.25"/>
  <rect x="220" y="195" width="25" height="65" rx="2" fill="#c8e6c9" opacity="0.3"/>
  <rect x="255" y="180" width="25" height="80" rx="2" fill="#c8e6c9" opacity="0.35"/>
  <rect x="290" y="170" width="25" height="90" rx="2" fill="#c8e6c9" opacity="0.4"/>
  <!-- Trend line -->
  <polyline points="92,220 127,200 162,185 197,175 232,195 267,180 302,170" stroke="#c8e6c9" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- Coin stack -->
  <ellipse cx="345" cy="80" rx="18" ry="6" fill="#c8e6c9" opacity="0.3"/>
  <rect x="327" y="80" width="36" height="8" fill="#c8e6c9" opacity="0.2"/>
  <ellipse cx="345" cy="88" rx="18" ry="6" fill="#c8e6c9" opacity="0.25"/>
  <rect x="327" y="88" width="36" height="8" fill="#c8e6c9" opacity="0.2"/>
  <ellipse cx="345" cy="96" rx="18" ry="6" fill="#c8e6c9" opacity="0.3"/>
</svg>