<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Heart with cross -->
  <path d="M200,120 C200,105 180,90 168,100 C156,110 156,118 200,150 C244,118 244,110 232,100 C220,90 200,105 200,120" fill="#e3f2fd" opacity="0.2"/>
  <!-- Cross -->
  <rect x="192" y="95" width="16" height="40" rx="2" fill="#e3f2fd" opacity="0.35"/>
  <rect x="182" y="105" width="36" height="12" rx="2" fill="#e3f2fd" opacity="0.35"/>
  <!-- DNA helix -->
  <path d="M80,80 Q100,110 80,140 Q60,170 80,200 Q100,230 80,260" stroke="#e3f2fd" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M100,80 Q80,110 100,140 Q120,170 100,200 Q80,230 100,260" stroke="#e3f2fd" stroke-width="2" fill="none" opacity="0.2"/>
  <line x1="85" y1="100" x2="95" y2="100" stroke="#e3f2fd" stroke-width="1.5" opacity="0.15"/>
  <line x1="75" y1="130" x2="105" y2="130" stroke="#e3f2fd" stroke-width="1.5" opacity="0.15"/>
  <line x1="85" y1="160" x2="95" y2="160" stroke="#e3f2fd" stroke-width="1.5" opacity="0.15"/>
  <line x1="75" y1="190" x2="105" y2="190" stroke="#e3f2fd" stroke-width="1.5" opacity="0.15"/>
  <!-- Stethoscope -->
  <path d="M300,100 Q320,120 310,150 L310,180" stroke="#e3f2fd" stroke-width="2.5" fill="none" opacity="0.25"/>
  <circle cx="310" cy="185" r="10" fill="#e3f2fd" opacity="0.25"/>
  <!-- Medical chart -->
  <rect x="260" y="200" width="80" height="60" rx="5" fill="#e3f2fd" opacity="0.1" stroke="#e3f2fd" stroke-width="1" stroke-opacity="0.2"/>
  <polyline points="270,245 285,235 300,240 315,220 330,225" stroke="#e3f2fd" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Pulse line -->
  <polyline points="40,150 70,150 80,130 90,170 100,140 110,160 130,150 160,150" stroke="#e3f2fd" stroke-width="1.5" fill="none" opacity="0.15"/>
</svg>