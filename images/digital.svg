<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Laptop/device -->
  <rect x="120" y="100" width="160" height="100" rx="8" fill="#f3e5f5" opacity="0.2" stroke="#f3e5f5" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="130" y="110" width="140" height="75" rx="4" fill="#f3e5f5" opacity="0.1"/>
  <rect x="90" y="200" width="220" height="12" rx="6" fill="#f3e5f5" opacity="0.2"/>
  <!-- Screen content - digital icons -->
  <circle cx="170" cy="140" r="12" fill="#f3e5f5" opacity="0.3"/>
  <circle cx="200" cy="140" r="12" fill="#f3e5f5" opacity="0.25"/>
  <circle cx="230" cy="140" r="12" fill="#f3e5f5" opacity="0.3"/>
  <!-- Data flow lines -->
  <line x1="50" y1="130" x2="120" y2="140" stroke="#f3e5f5" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="280" y1="140" x2="350" y2="130" stroke="#f3e5f5" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="50" y1="180" x2="120" y2="170" stroke="#f3e5f5" stroke-width="1.5" opacity="0.25" stroke-dasharray="4,4"/>
  <line x1="280" y1="170" x2="350" y2="180" stroke="#f3e5f5" stroke-width="1.5" opacity="0.25" stroke-dasharray="4,4"/>
  <!-- Floating nodes -->
  <circle cx="50" cy="120" r="8" fill="#f3e5f5" opacity="0.3"/>
  <circle cx="350" cy="120" r="8" fill="#f3e5f5" opacity="0.3"/>
  <circle cx="50" cy="175" r="6" fill="#f3e5f5" opacity="0.25"/>
  <circle cx="350" cy="175" r="6" fill="#f3e5f5" opacity="0.25"/>
  <!-- Binary/digital dots -->
  <circle cx="80" cy="80" r="3" fill="#f3e5f5" opacity="0.2"/>
  <circle cx="320" cy="80" r="3" fill="#f3e5f5" opacity="0.2"/>
  <circle cx="100" cy="250" r="3" fill="#f3e5f5" opacity="0.15"/>
  <circle cx="300" cy="250" r="3" fill="#f3e5f5" opacity="0.15"/>
</svg>