<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Envelope -->
  <rect x="120" y="70" width="160" height="110" rx="8" fill="#e3f2fd" opacity="0.2"/>
  <!-- Envelope flap -->
  <polygon points="120,70 200,130 280,70" fill="#e3f2fd" opacity="0.15"/>
  <!-- Envelope lines -->
  <line x1="120" y1="180" x2="180" y2="130" stroke="#e3f2fd" stroke-width="1" opacity="0.1"/>
  <line x1="280" y1="180" x2="220" y2="130" stroke="#e3f2fd" stroke-width="1" opacity="0.1"/>
  <!-- Mail icon -->
  <rect x="180" y="105" width="40" height="25" rx="3" fill="#e3f2fd" opacity="0.1"/>
  <polyline points="185,110 200,120 215,110" stroke="#e3f2fd" stroke-width="1.5" fill="none" opacity="0.2"/>
  <!-- Person silhouette -->
  <circle cx="200" cy="220" r="20" fill="#e3f2fd" opacity="0.25"/>
  <rect x="186" y="240" width="28" height="35" rx="4" fill="#e3f2fd" opacity="0.2"/>
  <!-- Send arrow -->
  <polygon points="300,110 330,100 300,130 310,100" fill="#e3f2fd" opacity="0.25"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="100" r="4" fill="#e3f2fd" opacity="0.15"/>
  <circle cx="320" cy="200" r="4" fill="#e3f2fd" opacity="0.15"/>
  <circle cx="60" cy="220" r="3" fill="#e3f2fd" opacity="0.1"/>
  <circle cx="340" cy="80" r="3" fill="#e3f2fd" opacity="0.1"/>
</svg>