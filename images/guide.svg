<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Open book -->
  <path d="M100,100 Q200,80 200,140 Q200,80 300,100 L300,200 Q200,180 200,200 Q200,180 100,200 Z" fill="#e8f5e9" opacity="0.15" stroke="#e8f5e9" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Left page lines -->
  <line x1="115" y1="120" x2="190" y2="110" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="115" y1="135" x2="190" y2="125" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="115" y1="150" x2="190" y2="140" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="115" y1="165" x2="160" y2="155" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <!-- Right page lines -->
  <line x1="210" y1="110" x2="285" y2="120" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="210" y1="125" x2="285" y2="135" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="210" y1="140" x2="285" y2="150" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <line x1="210" y1="155" x2="260" y2="165" stroke="#e8f5e9" stroke-width="0.8" opacity="0.15"/>
  <!-- Steps/staircase icon -->
  <rect x="80" y="220" width="40" height="30" rx="2" fill="#e8f5e9" opacity="0.15"/>
  <rect x="130" y="210" width="40" height="40" rx="2" fill="#e8f5e9" opacity="0.18"/>
  <rect x="180" y="195" width="40" height="55" rx="2" fill="#e8f5e9" opacity="0.2"/>
  <rect x="230" y="180" width="40" height="70" rx="2" fill="#e8f5e9" opacity="0.22"/>
  <rect x="280" y="165" width="40" height="85" rx="2" fill="#e8f5e9" opacity="0.25"/>
  <!-- Checkmarks -->
  <polyline points="90,235 96,242 105,228" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.4"/>
  <polyline points="140,225 146,232 155,218" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.4"/>
  <polyline points="190,215 196,222 205,208" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Light bulb -->
  <circle cx="200" cy="50" r="15" fill="#e8f5e9" opacity="0.15"/>
  <line x1="200" y1="65" x2="200" y2="75" stroke="#e8f5e9" stroke-width="2" opacity="0.2"/>
</svg>