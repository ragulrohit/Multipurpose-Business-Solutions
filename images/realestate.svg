  <line x1="163" y1="119" x2="185" y2="119" stroke="#c8e6c9" stroke-width="0.8" opacity="0.2"/>
  <rect x="215" y="110" width="22" height="18" rx="2" fill="#c8e6c9" opacity="0.25"/>
  <line x1="226" y1="110" x2="226" y2="128" stroke="#c8e6c9" stroke-width="0.8" opacity="0.2"/>
  <line x1="215" y1="119" x2="237" y2="119" stroke="#c8e6c9" stroke-width="0.8" opacity="0.2"/>
  <!-- Building/tower -->
  <rect x="60" y="80" width="50" height="100" rx="3" fill="#c8e6c9" opacity="0.1"/>
  <rect x="68" y="90" width="12" height="10" rx="1" fill="#c8e6c9" opacity="0.15"/>
  <rect x="85" y="90" width="12" height="10" rx="1" fill="#c8e6c9" opacity="0.15"/>
  <rect x="68" y="108" width="12" height="10" rx="1" fill="#c8e6c9" opacity="0.15"/>
  <rect x="85" y="108" width="12" height="10" rx="1" fill="#c8e6c9" opacity="0.15"/>
  <!-- Key icon -->
  <circle cx="330" cy="120" r="15" fill="none" stroke="#c8e6c9" stroke-width="2" opacity="0.25"/>
  <line x1="345" y1="120" x2="370" y2="120" stroke="#c8e6c9" stroke-width="2" opacity="0.25"/>
