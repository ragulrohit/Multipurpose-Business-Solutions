  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- House -->
  <polygon points="200,50 140,100 260,100" fill="#c8e6c9" opacity="0.2"/>
  <rect x="155" y="100" width="90" height="80" fill="#c8e6c9" opacity="0.18"/>
  <!-- Door -->
