<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Connection lines -->
  <line x1="120" y1="120" x2="200" y2="100" stroke="#b2dfdb" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="100" x2="280" y2="120" stroke="#b2dfdb" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="120" x2="200" y2="200" stroke="#b2dfdb" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="200" x2="280" y2="120" stroke="#b2dfdb" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="120" x2="280" y2="200" stroke="#b2dfdb" stroke-width="1.5" opacity="0.2"/>
  <!-- Person 1 -->
  <circle cx="120" cy="100" r="20" fill="#e0f2f1" opacity="0.9"/>
  <rect x="105" y="120" width="30" height="40" rx="4" fill="#e0f2f1" opacity="0.85"/>
  <!-- Person 2 -->
  <circle cx="200" cy="80" r="22" fill="#e0f2f1" opacity="0.9"/>
  <rect x="183" y="102" width="34" height="42" rx="4" fill="#e0f2f1" opacity="0.85"/>
  <!-- Person 3 -->
  <circle cx="280" cy="100" r="20" fill="#e0f2f1" opacity="0.9"/>
  <rect x="265" y="120" width="30" height="40" rx="4" fill="#e0f2f1" opacity="0.85"/>
  <!-- Person 4 (center bottom) -->
  <circle cx="200" cy="180" r="18" fill="#b2dfdb" opacity="0.9"/>
  <rect x="187" y="198" width="26" height="36" rx="4" fill="#b2dfdb" opacity="0.85"/>
  <!-- Handshake icons -->
  <circle cx="160" cy="140" r="6" fill="#e0f2f1" opacity="0.4"/>
  <circle cx="240" cy="140" r="6" fill="#e0f2f1" opacity="0.4"/>
  <!-- Base -->
  <rect x="0" y="290" width="400" height="10" fill="#004d40" opacity="0.3"/>
</svg>