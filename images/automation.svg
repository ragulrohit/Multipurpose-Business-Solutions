<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a"/>
      <stop offset="100%" style="stop-color:#9c27b0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Robot head -->
  <rect x="155" y="50" width="90" height="70" rx="12" fill="#e1bee7" opacity="0.3" stroke="#e1bee7" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Robot eyes -->
  <circle cx="180" cy="80" r="10" fill="#e1bee7" opacity="0.5"/>
  <circle cx="220" cy="80" r="10" fill="#e1bee7" opacity="0.5"/>
  <circle cx="180" cy="80" r="5" fill="#e1bee7" opacity="0.7"/>
  <circle cx="220" cy="80" r="5" fill="#e1bee7" opacity="0.7"/>
  <!-- Antenna -->
  <line x1="200" y1="50" x2="200" y2="30" stroke="#e1bee7" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="28" r="5" fill="#e1bee7" opacity="0.5"/>
  <!-- Robot body -->
  <rect x="165" y="125" width="70" height="55" rx="5" fill="#e1bee7" opacity="0.25"/>
  <!-- Gears -->
  <circle cx="130" cy="150" r="20" fill="none" stroke="#e1bee7" stroke-width="4" opacity="0.25"/>
  <circle cx="130" cy="150" r="8" fill="#e1bee7" opacity="0.2"/>
  <circle cx="270" cy="150" r="20" fill="none" stroke="#e1bee7" stroke-width="4" opacity="0.25"/>
  <circle cx="270" cy="150" r="8" fill="#e1bee7" opacity="0.2"/>
  <!-- Conveyor belt -->
  <rect x="60" y="210" width="280" height="12" rx="6" fill="#e1bee7" opacity="0.15"/>
  <circle cx="80" cy="216" r="10" fill="#e1bee7" opacity="0.2"/>
  <circle cx="320" cy="216" r="10" fill="#e1bee7" opacity="0.2"/>
  <!-- Items on belt -->
  <rect x="100" y="198" width="25" height="20" rx="3" fill="#e1bee7" opacity="0.3"/>
  <rect x="160" y="198" width="25" height="20" rx="3" fill="#e1bee7" opacity="0.25"/>
  <rect x="220" y="198" width="25" height="20" rx="3" fill="#e1bee7" opacity="0.3"/>
  <rect x="280" y="198" width="25" height="20" rx="3" fill="#e1bee7" opacity="0.25"/>
  <!-- Checkmarks -->
  <polyline points="110,250 115,260 125,245" stroke="#e1bee7" stroke-width="2" fill="none" opacity="0.35"/>
  <polyline points="195,250 200,260 210,245" stroke="#e1bee7" stroke-width="2" fill="none" opacity="0.35"/>
  <polyline points="280,250 285,260 295,245" stroke="#e1bee7" stroke-width="2" fill="none" opacity="0.35"/>
</svg>