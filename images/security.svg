<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828"/>
      <stop offset="100%" style="stop-color:#ff6f00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M200,50 L270,80 L270,160 Q270,210 200,250 Q130,210 130,160 L130,80 Z" fill="#ffcdd2" opacity="0.2" stroke="#ffcdd2" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Lock icon inside shield -->
  <rect x="180" y="140" width="40" height="35" rx="5" fill="#ffcdd2" opacity="0.3"/>
  <path d="M185,140 L185,128 Q185,112 200,112 Q215,112 215,128 L215,140" stroke="#ffcdd2" stroke-width="3" fill="none" opacity="0.35"/>
  <circle cx="200" cy="155" r="5" fill="#ffcdd2" opacity="0.45"/>
  <!-- Keyhole -->
  <rect x="198" y="158" width="4" height="12" rx="2" fill="#ffcdd2" opacity="0.45"/>
  <!-- Fingerprint/scan lines -->
  <ellipse cx="200" cy="80" rx="20" ry="10" fill="none" stroke="#ffcdd2" stroke-width="1" opacity="0.2"/>
  <ellipse cx="200" cy="80" rx="30" ry="15" fill="none" stroke="#ffcdd2" stroke-width="1" opacity="0.15"/>
  <!-- Security nodes -->
  <circle cx="80" cy="150" r="8" fill="#ffcdd2" opacity="0.25"/>
  <circle cx="320" cy="150" r="8" fill="#ffcdd2" opacity="0.25"/>
  <circle cx="80" cy="220" r="8" fill="#ffcdd2" opacity="0.2"/>
  <circle cx="320" cy="220" r="8" fill="#ffcdd2" opacity="0.2"/>
  <!-- Connection lines -->
  <line x1="130" y1="150" x2="88" y2="150" stroke="#ffcdd2" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="270" y1="150" x2="312" y2="150" stroke="#ffcdd2" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="130" y1="220" x2="88" y2="220" stroke="#ffcdd2" stroke-width="1" opacity="0.15" stroke-dasharray="3,3"/>
  <line x1="270" y1="220" x2="312" y2="220" stroke="#ffcdd2" stroke-width="1" opacity="0.15" stroke-dasharray="3,3"/>
  <!-- Checkmark -->
  <polyline points="190,200 198,210 215,190" stroke="#ffcdd2" stroke-width="3" fill="none" opacity="0.4"/>
</svg>