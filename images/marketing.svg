<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Megaphone -->
  <polygon points="100,130 180,100 180,180" fill="#e8f5e9" opacity="0.3"/>
  <rect x="85" y="125" width="20" height="30" rx="3" fill="#e8f5e9" opacity="0.35"/>
  <!-- Sound waves -->
  <path d="M190,120 Q220,90 250,120" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M190,140 Q230,110 270,140" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.25"/>
  <path d="M190,160 Q240,130 290,160" stroke="#e8f5e9" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Target/bullseye -->
  <circle cx="300" cy="100" r="35" fill="none" stroke="#e8f5e9" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="100" r="22" fill="none" stroke="#e8f5e9" stroke-width="2" opacity="0.25"/>
  <circle cx="300" cy="100" r="10" fill="#e8f5e9" opacity="0.3"/>
  <!-- People/audience silhouettes -->
  <circle cx="150" cy="220" r="12" fill="#e8f5e9" opacity="0.4"/>
  <circle cx="185" cy="215" r="14" fill="#e8f5e9" opacity="0.35"/>
  <circle cx="220" cy="220" r="12" fill="#e8f5e9" opacity="0.4"/>
  <circle cx="255" cy="218" r="13" fill="#e8f5e9" opacity="0.35"/>
  <circle cx="290" cy="220" r="12" fill="#e8f5e9" opacity="0.4"/>
  <!-- Bar chart -->
  <rect x="60" y="240" width="20" height="30" rx="2" fill="#e8f5e9" opacity="0.2"/>
  <rect x="90" y="225" width="20" height="45" rx="2" fill="#e8f5e9" opacity="0.25"/>
  <rect x="120" y="235" width="20" height="35" rx="2" fill="#e8f5e9" opacity="0.2"/>
  <rect x="150" y="215" width="20" height="55" rx="2" fill="#e8f5e9" opacity="0.3"/>
</svg>