<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#546e7a"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Factory building -->
  <rect x="80" y="120" width="100" height="100" rx="3" fill="#cfd8dc" opacity="0.15"/>
  <!-- Factory roof / sawtooth -->
  <polygon points="80,120 110,80 130,120" fill="#cfd8dc" opacity="0.12"/>
  <polygon points="120,120 150,80 170,120" fill="#cfd8dc" opacity="0.1"/>
  <polygon points="160,120 190,80 180,120" fill="#cfd8dc" opacity="0.12"/>
  <!-- Chimney -->
  <rect x="160" y="60" width="20" height="60" fill="#cfd8dc" opacity="0.12"/>
  <!-- Smoke -->
  <ellipse cx="170" cy="45" rx="15" ry="10" fill="#cfd8dc" opacity="0.08"/>
  <ellipse cx="165" cy="30" rx="12" ry="8" fill="#cfd8dc" opacity="0.06"/>
  <!-- Windows -->
  <rect x="95" y="140" width="20" height="15" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <rect x="125" y="140" width="20" height="15" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <rect x="155" y="140" width="20" height="15" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <!-- Gear -->
  <circle cx="300" cy="120" r="30" fill="none" stroke="#cfd8dc" stroke-width="6" opacity="0.2"/>
  <circle cx="300" cy="120" r="12" fill="#cfd8dc" opacity="0.15"/>
  <!-- Gear teeth -->
  <rect x="296" y="82" width="8" height="12" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <rect x="296" y="146" width="8" height="12" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <rect x="262" y="116" width="12" height="8" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <rect x="326" y="116" width="12" height="8" rx="2" fill="#cfd8dc" opacity="0.2"/>
  <!-- Conveyor -->
  <rect x="80" y="220" width="240" height="8" rx="4" fill="#cfd8dc" opacity="0.12"/>
  <circle cx="95" cy="224" r="8" fill="none" stroke="#cfd8dc" stroke-width="2" opacity="0.15"/>
  <circle cx="305" cy="224" r="8" fill="none" stroke="#cfd8dc" stroke-width="2" opacity="0.15"/>
  <!-- Products -->
  <rect x="130" y="208" width="20" height="16" rx="3" fill="#cfd8dc" opacity="0.18"/>
  <rect x="180" y="208" width="20" height="16" rx="3" fill="#cfd8dc" opacity="0.22"/>
  <rect x="230" y="208" width="20" height="16" rx="3" fill="#cfd8dc" opacity="0.18"/>
  <!-- Ground -->
  <rect x="0" y="225" width="400" height="75" fill="#cfd8dc" opacity="0.05"/>
</svg>