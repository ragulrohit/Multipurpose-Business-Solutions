<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00acc1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Gear 1 -->
  <circle cx="150" cy="130" r="35" fill="none" stroke="#e0f7fa" stroke-width="8" opacity="0.3"/>
  <circle cx="150" cy="130" r="15" fill="#e0f7fa" opacity="0.2"/>
  <rect x="145" y="85" width="10" height="15" rx="2" fill="#e0f7fa" opacity="0.3"/>
  <rect x="145" y="160" width="10" height="15" rx="2" fill="#e0f7fa" opacity="0.3"/>
  <rect x="105" y="125" width="15" height="10" rx="2" fill="#e0f7fa" opacity="0.3"/>
  <rect x="180" y="125" width="15" height="10" rx="2" fill="#e0f7fa" opacity="0.3"/>
  <!-- Gear 2 (smaller, interlocking) -->
  <circle cx="215" cy="160" r="25" fill="none" stroke="#e0f7fa" stroke-width="6" opacity="0.25"/>
  <circle cx="215" cy="160" r="10" fill="#e0f7fa" opacity="0.18"/>
  <rect x="212" y="128" width="6" height="12" rx="2" fill="#e0f7fa" opacity="0.25"/>
  <rect x="212" y="180" width="6" height="12" rx="2" fill="#e0f7fa" opacity="0.25"/>
  <!-- Circuit board lines -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#e0f7fa" stroke-width="1" opacity="0.15"/>
  <line x1="50" y1="220" x2="350" y2="220" stroke="#e0f7fa" stroke-width="1" opacity="0.1"/>
  <line x1="100" y1="180" x2="100" y2="250" stroke="#e0f7fa" stroke-width="1" opacity="0.1"/>
  <line x1="200" y1="180" x2="200" y2="250" stroke="#e0f7fa" stroke-width="1" opacity="0.12"/>
  <line x1="300" y1="180" x2="300" y2="250" stroke="#e0f7fa" stroke-width="1" opacity="0.1"/>
  <!-- Nodes on circuit -->
  <circle cx="100" cy="200" r="4" fill="#e0f7fa" opacity="0.25"/>
  <circle cx="200" cy="220" r="4" fill="#e0f7fa" opacity="0.25"/>
  <circle cx="300" cy="200" r="4" fill="#e0f7fa" opacity="0.25"/>
  <!-- Chip icon -->
  <rect x="170" y="230" width="60" height="40" rx="5" fill="#e0f7fa" opacity="0.12" stroke="#e0f7fa" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="185" y="245" width="30" height="10" rx="2" fill="#e0f7fa" opacity="0.15"/>
</svg>