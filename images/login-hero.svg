<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Person large silhouette -->
  <circle cx="200" cy="110" r="40" fill="#e8eaf6" opacity="0.25"/>
  <rect x="172" y="150" width="56" height="50" rx="8" fill="#e8eaf6" opacity="0.2"/>
  <!-- Lock icon -->
  <rect x="185" y="215" width="30" height="25" rx="4" fill="#e8eaf6" opacity="0.2"/>
  <path d="M190,215 L190,208 Q190,198 200,198 Q210,198 210,208 L210,215" stroke="#e8eaf6" stroke-width="2" fill="none" opacity="0.25"/>
  <circle cx="200" cy="226" r="3" fill="#e8eaf6" opacity="0.35"/>
  <!-- Login form outline -->
  <rect x="100" y="250" width="200" height="35" rx="17" fill="#e8eaf6" opacity="0.12" stroke="#e8eaf6" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Decorative rings -->
  <circle cx="200" cy="110" r="55" fill="none" stroke="#e8eaf6" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="110" r="70" fill="none" stroke="#e8eaf6" stroke-width="0.8" opacity="0.07"/>
  <!-- Side decorations -->
  <rect x="40" y="130" width="30" height="4" rx="2" fill="#e8eaf6" opacity="0.1"/>
  <rect x="330" y="130" width="30" height="4" rx="2" fill="#e8eaf6" opacity="0.1"/>
  <rect x="50" y="145" width="20" height="3" rx="1.5" fill="#e8eaf6" opacity="0.08"/>
  <rect x="330" y="145" width="20" height="3" rx="1.5" fill="#e8eaf6" opacity="0.08"/>
</svg>